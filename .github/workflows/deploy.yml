name: Deploy Static Site to Pages

# This tells GitHub to run the workflow automatically whenever you push code changes
on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows you to also trigger it manually if needed

# Grant required permissions for GitHub Pages to deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from conflicting
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Adjust the "path" below if your build files live in a folder like "dist" or "build"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
